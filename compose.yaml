services:
    # API Symfony -> http://localhost:8000
    backend:
        build: ./backend
        user: "${UID:-1000}:${GID:-1000}"
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
        depends_on:
            - db

    # React (Vite) -> http://localhost:5173
    frontend:
        image: node:22
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            API_URL: http://backend:8000
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - backend

    # Base de données MySQL
    db:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: evently
            MYSQL_USER: evently
            MYSQL_PASSWORD: evently
        volumes:
            - db_data:/var/lib/mysql

    # phpMyAdmin -> http://localhost:8080 (utilisateur : evently / evently)
    phpmyadmin:
        image: phpmyadmin:5
        environment:
            PMA_HOST: db
        ports:
            - "8080:80"
        depends_on:
            - db

volumes:
    db_data:
