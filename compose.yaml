services:
    # API Symfony -> http://localhost:8000
    backend:
        build: ./backend
        user: "${UID:-1000}:${GID:-1000}" # En dev, permet d'avoir les bons droits sur les fichiers avec ./backend:/app
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?serverVersion=8.4.0&charset=utf8mb4"
        volumes:
            - ./backend:/app # En dev, permet de monter le code source dans le conteneur pour le recharger à chaud -> A CHANGER EN PROD
        depends_on:
            - db

    # React (Vite) -> http://localhost:5173
    frontend:
        image: node:22
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            API_URL: http://backend:8000
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - backend

    # Base de données MySQL (identifiants dans le fichier .env à la racine)
    db:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql

    # phpMyAdmin -> http://localhost:8080 (identifiants MYSQL_USER / MYSQL_PASSWORD du .env)
    phpmyadmin:
        image: phpmyadmin:5
        environment:
            PMA_HOST: db
        ports:
            - "8080:80"
        depends_on:
            - db

volumes:
    db_data:
